<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דוח נוכחות מבצע תפילה</title>
    <link rel="icon" href="https://smt-tel-manager.netlify.app/smt.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link href="/tfila/style.css" rel="stylesheet">
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden antialiased text-slate-800">

    <!-- מסך התחברות -->
    <div id="login-screen" class="hidden fixed inset-0 bg-slate-50 items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 w-96 max-w-[90%] flex flex-col items-center">
            <!-- לוגו מוגן מגרירה ובחירה -->
            <img src="https://smt-tel-manager.netlify.app/smt.png" draggable="false" ondragstart="return false;" class="h-14 mb-4 select-none pointer-events-none" alt="SMT Logo">
            <div class="text-center mb-6">
                <i class="fas fa-lock text-3xl text-indigo-600 mb-2"></i>
                <h2 class="text-2xl font-extrabold text-slate-800">כניסה למערכת</h2>
            </div>
            <input type="password" id="password-input" autofocus placeholder="הכנס סיסמה" class="w-full px-4 py-3 border border-slate-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-lg font-medium">
            <button onclick="login()" id="login-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-bold transition-all shadow-md">היכנס</button>
            <p id="login-error" class="text-red-500 text-center mt-4 font-bold hidden"></p>
        </div>
    </div>

    <!-- מעטפת האפליקציה -->
    <div id="app-container" class="hidden w-full h-full">
        <!-- תפריט צד (Sidebar) -->
        <aside class="w-56 bg-white border-l border-slate-200 flex flex-col shadow-sm z-20 shrink-0">
            
            <!-- אזור קרדיט ולוגו עליון מצומצם במיוחד -->
            <div class="pt-3 pb-2 px-2 flex flex-col items-center justify-center border-b border-slate-200 bg-slate-50/80 text-center">
                <h1 class="text-[12px] font-extrabold text-slate-800 leading-none mb-1">ממשק דוחות מבצע תפילה</h1>
                <p class="text-[10px] text-slate-500 leading-none mb-2">פיתוח מיוחד עבור ת"ת בת עין צפת</p>
                
                <div class="flex flex-col items-center border-t border-slate-200 pt-1.5 w-full">
                    <div class="flex items-center gap-1 text-[10px] mb-0.5">
                        <span class="text-slate-420">פותח ע"י</span>
                        <span class="font-bold text-indigo-620">שימי טרייטל</span>
                    </div>
                    <img src="https://smt-tel-manager.netlify.app/smt.png" draggable="false" class="h-12 select-none pointer-events-none drop-shadow-sm" alt="SMT Logo">
                </div>
            </div>
            
            <nav class="flex-1 px-3 py-2.5 space-y-1 overflow-y-auto">
                <a href="#" id="nav-reports" onclick="switchView('reports')" class="flex items-center gap-3 px-3 py-2.5 bg-indigo-50 text-indigo-700 rounded-lg font-bold transition-all border border-indigo-100 text-sm cursor-pointer">
                    <i class="fas fa-chart-line w-5 text-center"></i>
                    <span>דוחות נוכחות</span>
                </a>
                <a href="#" id="nav-students" onclick="switchView('students')" class="flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 rounded-lg font-medium transition-all text-sm cursor-pointer">
                    <i class="fas fa-users w-5 text-center"></i>
                    <span>ניהול תלמידים</span>
                </a>
                <a href="#" id="nav-vacations" onclick="switchView('vacations')" class="flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 rounded-lg font-medium transition-all text-sm cursor-pointer">
                    <i class="far fa-calendar-alt w-5 text-center"></i>
                    <span>יומן חופשות</span>
                </a>
            </nav>

            <div class="p-3 border-t border-slate-100">
                <button onclick="logout()" class="flex items-center gap-3 px-3 py-2 w-full text-slate-500 hover:text-red-600 hover:bg-red-50 transition-colors font-bold rounded-lg text-sm">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>התנתק</span>
                </button>
            </div>
        </aside>

        <!-- אזור תוכן מרכזי -->
        <main class="flex-1 flex flex-col h-screen overflow-auto bg-slate-50 relative p-6" id="app-content">
            
            <!-- תצוגת דוחות נוכחות -->
            <div id="reports-view" class="w-full h-full block max-w-[1400px] mx-auto">
                <!-- הדוחות והספינר יוזרקו לכאן -->
            </div>

            <!-- תצוגת ניהול תלמידים -->
            <div id="students-view" class="hidden w-full h-full flex-col max-w-[1400px] mx-auto">
                <div class="w-full h-20 mb-5 flex justify-between items-center bg-white px-6 rounded-xl shadow-sm border border-slate-200 no-print">
                    <div class="flex items-center gap-3">
                        <button onclick="openStudentModal()" class="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors shadow-sm text-sm">
                            <i class="fas fa-plus ml-2"></i>הוסף תלמיד
                        </button>
                        
                        <div id="bulk-action-container" class="hidden items-center gap-3 bg-indigo-50 px-4 py-1.5 rounded-lg border border-indigo-200 shadow-sm transition-all">
                            <span class="text-sm font-bold text-indigo-800"><span id="selected-count">0</span> נבחרו</span>
                            <input type="text" id="bulk-class-input" placeholder="כיתה חדשה" class="w-24 px-3 py-1.5 text-sm font-bold border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none text-center">
                            <button onclick="executeBulkUpdate()" class="px-4 py-1.5 bg-indigo-600 text-white text-sm font-bold rounded-md hover:bg-indigo-700 transition-colors shadow-sm">
                                עדכן כיתה
                            </button>
                        </div>
                    </div>
                    
                    <h2 class="text-2xl font-black text-indigo-700 flex items-center justify-center gap-3">
                        <i class="fas fa-user-graduate text-indigo-500"></i>
                        ניהול תלמידים
                    </h2>
                    
                    <div class="font-bold text-slate-600 bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 text-sm">
                        סה"כ תלמידים: <span id="total-students-count" class="text-indigo-600 mr-1 text-lg">0</span>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden flex-1 relative min-h-[300px]">
                    <div class="overflow-x-auto h-full">
                        <table class="w-full text-center border-collapse">
                            <thead class="bg-slate-100 sticky top-0 z-10 shadow-sm border-b border-slate-300">
                                <tr>
                                    <th class="px-4 py-3 border-x border-slate-300 w-12 no-print">
                                        <input type="checkbox" id="select-all-cb" onchange="toggleAllStudents(this)" class="w-4 h-4 cursor-pointer text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                                    </th>
                                    <th class="px-4 py-3 font-bold text-slate-800 border-x border-slate-300 w-24">קוד</th>
                                    <th class="px-4 py-3 font-bold text-slate-800 border-x border-slate-300">שם פרטי</th>
                                    <th class="px-4 py-3 font-bold text-slate-800 border-x border-slate-300">משפחה</th>
                                    <th class="px-4 py-3 font-bold text-slate-800 border-x border-slate-300 w-32">כיתה</th>
                                    <th class="px-4 py-3 font-bold text-slate-800 border-x border-slate-300 w-32 no-print">פעולות</th>
                                </tr>
                            </thead>
                            <tbody id="students-table-body">
                                <!-- תלמידים יוזרקו לכאן -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- תצוגת יומן חופשות -->
            <div id="vacations-view" class="hidden w-full h-full flex-col max-w-[1400px] mx-auto">
                <div class="w-full h-20 mb-5 flex justify-between items-center bg-white px-6 rounded-xl shadow-sm border border-slate-200 shrink-0 no-print">
                    <button onclick="navigateMonth(-1)" class="w-10 h-10 flex items-center justify-center bg-slate-50 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-100 hover:text-indigo-600 transition-colors shadow-sm" title="חודש קודם">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <h2 id="calendar-title" class="text-2xl font-black text-indigo-700 flex items-center justify-center gap-3 text-center">
                        <i class="fas fa-calendar-day text-indigo-500"></i>
                        טוען נתונים...
                    </h2>
                    <button onclick="navigateMonth(1)" class="w-10 h-10 flex items-center justify-center bg-slate-50 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-100 hover:text-indigo-600 transition-colors shadow-sm" title="חודש הבא">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-300 flex-1 relative p-6 overflow-y-auto">
                    <div id="calendar-grid-container" class="h-full">
                        <!-- הלוח שנה יוזרק לכאן -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- מודל הוספה/עריכת תלמיד -->
    <div id="student-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm items-center justify-center z-[60]">
        <div class="bg-white p-6 rounded-xl shadow-2xl border border-slate-200 w-[400px] max-w-[95%] relative">
            <button onclick="closeStudentModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 transition">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 id="student-modal-title" class="text-xl font-bold text-slate-800 mb-6 text-center">הוספת תלמיד חדש</h3>
            
            <form id="student-form" onsubmit="saveStudent(event)">
                <input type="hidden" id="student-mode" value="add">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">קוד תלמיד</label>
                        <input type="text" id="student-code" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">שם פרטי</label>
                        <input type="text" id="student-first-name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">שם משפחה</label>
                        <input type="text" id="student-last-name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">כיתה</label>
                        <input type="text" id="student-class" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" onclick="closeStudentModal()" class="px-5 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 transition">ביטול</button>
                    <button type="submit" id="student-save-btn" class="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition shadow-md w-28">שמור</button>
                </div>
            </form>
        </div>
    </div>

    <!-- מודל שליחת מייל -->
    <div id="email-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm items-center justify-center z-[60]">
        <div class="bg-white p-6 rounded-xl shadow-2xl border border-slate-200 w-96 max-w-[95%]">
            <h3 class="text-xl font-bold text-slate-800 mb-4"><i class="fas fa-envelope text-indigo-600 ml-2"></i>שליחת דוח במייל</h3>
            <label class="block text-sm font-bold text-slate-600 mb-1">כתובות אימייל (מופרדות בפסיק)</label>
            <input type="text" id="email-input" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-left mb-6" dir="ltr" placeholder="example@mail.com">
            <div class="flex justify-end gap-3">
                <button onclick="closeEmailModal()" class="px-5 py-2 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 transition">ביטול</button>
                <button onclick="sendEmailAction(this)" class="px-5 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition shadow-md">שלח עכשיו</button>
            </div>
        </div>
    </div>

    <script src="/tfila/client-app.js"></script>
    <script src="/tfila/client-reports.js"></script>
    <script src="/tfila/client-students.js"></script>
    <script src="/tfila/client-vacations.js"></script>
</body>
</html>
